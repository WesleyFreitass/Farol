name: Deploy Farol na VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Sincronizar e Subir Container Farol
    runs-on: ubuntu-latest
    steps:
      - name: Executar deploy via SSH na VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Iniciando deploy do Farol..."
            if [ ! -d "/root/farol" ]; then
              echo "📂 Diretório /root/farol não encontrado. Clonando repositório..."
              git clone https://github.com/WesleyFreitass/Farol.git /root/farol
            fi
            cd /root/farol
            echo "🔄 Atualizando código na branch main..."
            git clean -fd
            git fetch origin main
            git reset --hard origin/main
            echo "🐳 Subindo container com Docker Compose..."
            docker compose up -d --build
            echo "✅ [CI/CD] Deploy do Farol concluído com sucesso!"
